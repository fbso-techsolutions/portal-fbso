name: Deploy

# Publica o portal na Cloudflare a cada merge na `main` (nunca em PR — branch não-publicada).
on:
  push:
    branches: [main]
  # Redeploy manual (operator) sem novo commit — continua restrito à `main`.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  # Não cancela um deploy em andamento (evita publicar pela metade).
  cancel-in-progress: false

jobs:
  deploy:
    name: build + wrangler deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          # Credenciais vêm do GitHub Secrets — nada versionado no repo.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
