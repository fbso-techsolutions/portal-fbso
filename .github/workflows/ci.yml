name: CI

# Gate de merge: nenhum PR entra em `develop` com lint, tipos ou testes quebrados.
# Roda **só em PR** — no merge, quem valida/rebuild é o `deploy.yml` (ADR-009/ADR-011).
on:
  pull_request:
    branches: [develop]

# Somente leitura: o workflow valida, não publica nada.
permissions:
  contents: read

# Um run por ref; push novo cancela o anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint → typecheck → test
    # Runner pinado: `ubuntu-latest` migra silenciosamente de imagem (ex.: Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Versão única, lida do `.nvmrc` (a mesma do ambiente local).
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` respeita o lockfile — nunca `npm install` no CI.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Sem `build` no PR (ADR-011): o build (e o artefato) acontece pós-merge, no deploy.
      # SAST roda em workflow separado (`codeql.yml`).
      - name: Test
        run: npm run test
